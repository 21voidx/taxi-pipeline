    depends_on:
      - ref('agg_daily_city_service')
      - ref('agg_hourly_city_service')
    owner:
      name: Portfolio Owner
      email: portfolio@example.com

  - name: operations_dashboard
    label: Ride-Hailing Operations Dashboard
