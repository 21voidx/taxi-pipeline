name: Data Generator CI/CD

on:
  pull_request:
    branches: [development, production]
    paths:
      - "generator/**"
      - ".github/workflows/data-generator.yml"
  push:
    branches: [development, production]
    paths:
      - "generator/**"
      - ".github/workflows/data-generator.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Test generator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t generator-ci:"$GITHUB_SHA" generator

      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD/generator/tests:/tests:ro" \
            generator-ci:"$GITHUB_SHA" \
            sh -lc 'pip install --quiet pytest && pytest -q /tests'

  publish:
    name: Publish generator image
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE_BASE="ghcr.io/${GITHUB_REPOSITORY,,}-generator"
          docker build \
            -t "$IMAGE_BASE:$GITHUB_SHA" \
            -t "$IMAGE_BASE:${GITHUB_REF_NAME}-runtime" \
            generator
          docker push "$IMAGE_BASE:$GITHUB_SHA"
          docker push "$IMAGE_BASE:${GITHUB_REF_NAME}-runtime"

  deploy:
    name: Deploy generator
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: [self-hosted, Linux, X64]
    environment: ${{ github.ref_name }}
    concurrency:
      group: generator-${{ github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Deploy generator only
        run: |
          DEPLOY_ROOT="/opt/data-platform-${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-generator:${GITHUB_SHA}"

          if [ ! -f "$DEPLOY_ROOT/compose.yaml" ]; then
            echo "Generator image published. Platform bootstrap is still pending."
            exit 0
          fi

          cd "$DEPLOY_ROOT"
          sed -i "s|^GENERATOR_IMAGE_NAME=.*|GENERATOR_IMAGE_NAME=$IMAGE|" .env
          docker compose --env-file .env -f compose.yaml pull generator
          docker compose --env-file .env -f compose.yaml up -d --no-deps generator
          echo "$GITHUB_SHA" > GENERATOR_VERSION
          docker compose --env-file .env -f compose.yaml ps generator
